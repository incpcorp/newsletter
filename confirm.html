<script>(function(){
var q=new URLSearchParams(location.search),a=q.get('a')||'',t=q.get('t')||'';
var T=document.getElementById('cf-title'),M=document.getElementById('cf-msg'),H=document.getElementById('cf-home'),P=document.getElementById('cf-help');
function show(title,msg,ok){T.textContent=title;M.textContent=msg;H.style.display='inline-block';if(!ok)P.style.display='block';document.title=title+' | DI Forum';}
function go(){
 var ep=(window.DIF_CONFIG||{}).endpoint;
 if(!ep){return show('잠시 후 다시 시도해 주세요','구독 시스템에 연결하지 못했습니다.',false);}
 if(t==='TEST'){return show('테스트 메일의 링크입니다','실제 발송 메일에서는 이 링크로 수신거부가 처리됩니다.',true);}
 if(!/^[0-9a-f]{32}$/.test(t)||(a!=='confirm'&&a!=='unsub')){return show('링크가 올바르지 않습니다','메일에 있는 링크를 다시 눌러 주세요.',false);}
 fetch(ep+'?a='+encodeURIComponent(a)+'&t='+encodeURIComponent(t)+'&f=json').then(function(r){return r.json();})
  .then(function(j){show(j.title||'처리되었습니다',j.message||'',j.ok!==false);})
  .catch(function(){show('처리 결과를 확인하지 못했습니다','잠시 후 메일의 버튼을 다시 눌러 주세요.',false);});
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',go);else go();
})();</script>
